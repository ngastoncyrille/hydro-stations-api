spring.application.name=hydro-stations-api

# Base H2 en mémoire pour la démonstration (remplaçable par PostgreSQL en production)
spring.datasource.url=jdbc:h2:mem:hydro;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true

# Une station est déclarée silencieuse au-delà de ce délai sans transmission
hydro.delai-silence=PT6H
